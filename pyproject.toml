[project]
name = "tuning-landing"
version = "0.1.0"
description = "Landing page built with Django templates"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"_project/settings/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
